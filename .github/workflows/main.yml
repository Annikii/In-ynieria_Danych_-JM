name: Nowy ETL - Neon do BigQuery

on:
  push:
    branches:
      - main
  workflow_dispatch: # Pozwala na ręczne uruchomienie (przycisk "Run workflow")
  schedule:
    - cron: '0 12 * * *' # Uruchamia codziennie o 12:00 (możesz usunąć, jeśli nie potrzebujesz)

jobs:
  run-etl:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          pip install pandas psycopg2-binary google-cloud-bigquery db-dtypes sqlalchemy
          # Jeśli w repozytorium masz plik requirements.txt, podmień powyższą linię na:
          # pip install -r requirements.txt

      # Uwierzytelnienie do Google Cloud - upewnij się, że nazwa secretu z kluczem JSON się zgadza
      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}' 

      - name: Uruchomienie skryptu extract_load.py
        env:
          NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
          BQ_PROJECT_ID: ${{ secrets.BQ_PROJECT_ID }}
          BQ_DATASET: ${{ secrets.BQ_DATASET }}
          BQ_TABLE: ${{ secrets.BQ_TABLE }}
        run: python extract_load.py
